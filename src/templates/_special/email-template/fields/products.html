{% set elements = value.all() %}

{% if elements | length %}
    <ul>
        {% for element in elements %}
            {% set url = field.getSafeElementUrl(element, field.emailFieldSummaryValue == 'cpUrl') %}
                
            <li>
                {% if url %}
                    <a href="{{ url }}">{{ element.title }}</a>
                {% else %}
                    {{ element.title }}
                {% endif %}
            </li>
        {% endfor %}
    </ul>
{% endif %}
