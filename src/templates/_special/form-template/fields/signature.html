{{ fieldtag('fieldInput') }}

<div class="formie-signature-pad" data-formie-signature-pad>
    {% fieldtag 'fieldCanvas' %}{% endfieldtag %}
    {% fieldtag 'fieldMessage' %}{% endfieldtag %}
</div>

<noscript>
    <p class="formie-signature-message formie-signature-message-noscript">{{ 'Signatures require JavaScript. Enable JavaScript to sign this form.' | t('formie') }}</p>
</noscript>

{% fieldtag 'fieldRemoveButton' %}
    {{- 'Clear' | t('formie') -}}
{% endfieldtag %}
