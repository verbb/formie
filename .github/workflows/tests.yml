name: Tests
'on':
  push:
    branches:
    - beta
    - craft-5
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: push-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  php-check:
    name: PHP 8.2.0 syntax and imports
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: ./tests/push minimum
  tests:
    name: Push checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Frontend tests and build
        run: ./tests/push frontend
      - uses: ./.github/actions/setup-test-runtime
        with:
          php-version: '8.3'
          docroot: tests/runtime/web
      - name: PHP integration
        run: ./tests/push integration
      - name: Chromium smoke test
        run: ./tests/push browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: push-test-diagnostics
          include-hidden-files: true
          path: |
            .cache/verbb-tests/result.json
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/junit.xml
            .cache/verbb-tests/browser-report/
            test-results/
