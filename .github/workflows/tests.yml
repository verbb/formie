name: Tests
on:
  push:
    branches: [beta, craft-5]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 17 * * 1'
permissions:
  contents: read
jobs:
  php-check:
    name: PHP 8.2.0 syntax and imports
    runs-on: ubuntu-22.04
    # setup-php selects a current patch; the official image preserves the exact minimum.
    container: php:8.2.0-cli@sha256:fa840989efc52df732278f59377e780f65d6aa8c384bb9724babf190b49f4c35
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
    timeout-minutes: 20
    steps:
      # Git avoids the archive fallback, which omits files marked export-ignore.
      - name: Install Git for checkout
        run: |
          sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g; s|deb.debian.org/debian|archive.debian.org/debian|g; /bullseye-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v5
      - name: Verify complete checkout
        run: |
          # Checkout trusts the workspace only in its temporary Git configuration.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --is-inside-work-tree)" = true
          test -f .github/scripts/setup-minimum-php.sh
          test -f tests/php-check/tests/run.php
      - name: Install minimum PHP dependencies
        run: bash .github/scripts/setup-minimum-php.sh
      - name: Verify exact minimum interpreter
        run: |
          php -r 'echo PHP_VERSION, PHP_EOL; exit(PHP_VERSION === "8.2.0" ? 0 : 1);'
      - name: Verify integration dependency lock
        run: php .github/scripts/check-runtime-lock.php
      - name: Install class checker
        run: composer install --working-dir=tests/php-check --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
      - name: Class checker regression tests
        run: php tests/php-check/tests/run.php
      - name: Check validation tooling
        run: php tests/php-check/bin/check.php --project tests/php-check --vendor tests/php-check/vendor tests/php-check/src tests/php-check/bin tests/php-check/prepare.php tests/php-check/tests
      - name: Prepare minimum PHP dependencies
        run: php tests/php-check/prepare.php
      - name: Resolve dependencies on PHP 8.2.0
        run: composer update --working-dir=.cache/php-check --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
      - name: Verify dependency platform requirements
        run: composer check-platform-reqs --working-dir=.cache/php-check --no-plugins
      - name: Check all production PHP
        run: php tests/php-check/bin/check.php --project . --vendor .cache/php-check/vendor --optional tests/Support/StaticAnalysis/optional-classes.php src .github/scripts/check-runtime-lock.php
      - name: Dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-8.2.0-dependencies
          include-hidden-files: true
          path: |
            .cache/php-check/composer.json
            .cache/php-check/composer.lock
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run release:check-lockfile
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build:packages
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: [default, random]
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - name: Verify DDEV test runtime
        run: bash .github/scripts/configure-ddev.sh 8.3
      - name: Clean-install integration tests
        run: ddev test --order-by=${{ matrix.order }} --random-order-seed=9122026
      - name: Production class resolution
        run: ddev exec php tests/runtime/pest.php --configuration=phpunit.craft.xml --filter=ClassResolutionTest
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.order }}
          include-hidden-files: true
          path: |
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/junit.xml
            .cache/verbb-tests/result.json
            .cache/verbb-tests/app/storage/logs/
  extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [performance, slow, migration, commerce, single-site]
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - name: Verify DDEV test runtime
        run: bash .github/scripts/configure-ddev.sh 8.3
      - run: ddev test --suite=${{ matrix.suite }}
      - name: Targeted mutation checks
        if: matrix.suite == 'migration'
        run: ddev exec php tests/runtime/mutations.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/junit.xml
            .cache/verbb-tests/result.json
            .cache/verbb-tests/app/storage/logs/
            .cache/verbb-tests/mutations/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run release:check-lockfile
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - name: Verify DDEV test runtime
        run: bash .github/scripts/configure-ddev.sh 8.3
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: ddev test --task=browser-fixture
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          include-hidden-files: true
          path: |
            .cache/verbb-tests/browser-report/
            .cache/verbb-tests/app/storage/logs/
            test-results/
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sites: single
            args: --single-site
          - sites: multiple
            args: ''
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - name: Verify DDEV test runtime
        run: bash .github/scripts/configure-ddev.sh 8.3
      - run: ddev test --task=lifecycle
      - run: ddev test --task=upgrade ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: populated-upgrade-${{ matrix.sites }}
          include-hidden-files: true
          path: |
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/result.json
            .cache/verbb-tests/upgrade-fixture.json
            .cache/verbb-tests/upgrade-app/coverage-map.json
            .cache/verbb-tests/upgrade-app/round-two-map.json
            .cache/verbb-tests/upgrade-app/.state/
            .cache/verbb-tests/upgrade-app/storage/logs/
