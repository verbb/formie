name: Tests
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 17 * * 1'
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build:packages
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: [default, random]
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - name: Clean-install integration tests
        run: ddev test --order-by=${{ matrix.order }} --random-order-seed=9122026
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.order }}
          include-hidden-files: true
          path: |
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/junit.xml
            .cache/verbb-tests/result.json
            .cache/verbb-tests/app/storage/logs/
  extended:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [performance, slow, migration, commerce, single-site]
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - run: ddev test --suite=${{ matrix.suite }}
      - name: Targeted mutation checks
        if: matrix.suite == 'migration'
        run: ddev exec php tests/runtime/mutations.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/junit.xml
            .cache/verbb-tests/result.json
            .cache/verbb-tests/app/storage/logs/
            .cache/verbb-tests/mutations/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: ddev test --task=browser-fixture
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          include-hidden-files: true
          path: |
            .cache/verbb-tests/browser-report/
            .cache/verbb-tests/app/storage/logs/
            test-results/
  upgrade:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: '1.25.4'
          autostart: false
      - run: ddev test --task=lifecycle
      - run: ddev test --task=upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: populated-upgrade-results
          include-hidden-files: true
          path: |
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/result.json
            .cache/verbb-tests/upgrade-fixture.json
            .cache/verbb-tests/upgrade-app/storage/logs/
