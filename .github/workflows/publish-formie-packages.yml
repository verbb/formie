name: Publish Formie Packages

# Manager dispatches stable releases on craft-5 with the reviewed release SHA;
# the run checks out that exact commit and verifies it belongs to craft-5.
# Pushes that change published package files publish to next automatically, which
# includes the release commit itself, so next never stays behind latest.

on:
    push:
        branches:
            - craft-5
        paths:
            - 'packages/formie-*/**'
            - '!packages/formie-*/CHANGELOG.md'
            - '!packages/formie-*/README.md'
            - 'scripts/generate-browser-theme-state.mjs'
            - 'src/config/browser-theme-state.json'
    workflow_dispatch:
        inputs:
            release_sha:
                description: Full reviewed release commit SHA on craft-5
                required: true
                type: string
            release_version:
                description: Stable package version for latest; leave empty for next
                required: false
                type: string
            channel:
                description: npm distribution channel
                required: true
                default: latest
                type: choice
                options:
                    - latest
                    - next

env:
    RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    RELEASE_VERSION: ${{ inputs.release_version }}
    RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'next' || inputs.channel || 'latest' }}

# Never let two attempts race over the same lockstep package release. GitHub
# replaces a group's pending run with a newer one, so channels stay separate to
# keep a push to next from discarding a waiting stable release.
concurrency:
    group: formie-npm-publish-${{ github.event_name == 'push' && 'next' || inputs.channel || 'latest' }}
    cancel-in-progress: false

jobs:
    validate:
        if: github.ref == 'refs/heads/craft-5'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Check out reviewed commit
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.RELEASE_SHA }}
                  fetch-depth: 0

            - name: Verify commit belongs to craft-5
              run: |
                  if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo 'A full lowercase commit SHA is required.' >&2
                    exit 1
                  fi
                  test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
                  git fetch origin craft-5
                  git merge-base --is-ancestor "$RELEASE_SHA" origin/craft-5

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: Check Node and npm versions
              run: |
                  node --version
                  npm --version
                  node -e 'const version = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [major, minor, patch] = version.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)'

            - name: Verify standalone dependency lockfile
              run: npm run release:check-lockfile

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Build publishable packages
              run: npm run build:packages

            - name: Run package tests
              run: npm test -w @verbb/formie-core

            - name: Test package publication tooling
              run: node --test tests/scripts/package-release.test.mjs

            - name: Inspect all package tarballs
              run: |
                  for package in \
                    @verbb/formie-core \
                    @verbb/formie-browser \
                    @verbb/formie-react \
                    @verbb/formie-vue \
                    @verbb/formie-web-components; do
                    echo "::group::Pack $package"
                    npm pack --dry-run -w "$package"
                    echo '::endgroup::'
                  done

            - name: Reject regenerated repository files
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    echo 'Build or pack regenerated repository files:' >&2
                    git status --short
                    git diff --stat
                    git diff --
                    exit 1
                  fi

            - name: Create reviewed package tarballs
              env:
                  PACKAGE_TARBALL_DIR: ${{ runner.temp }}/formie-tarballs
              run: node scripts/pack-prepared.mjs

            - name: Transfer validated tarballs to publish job
              uses: actions/upload-artifact@v4
              with:
                  name: formie-release-tarballs
                  path: ${{ runner.temp }}/formie-tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    publish:
        needs: validate
        if: github.ref == 'refs/heads/craft-5'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Check out reviewed commit without dependencies
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.RELEASE_SHA }}

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: Check supported npm CLI
              run: |
                  node --version
                  npm --version
                  node -e 'const version = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [major, minor, patch] = version.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)'

            - name: Receive validated tarballs
              uses: actions/download-artifact@v4
              with:
                  name: formie-release-tarballs
                  path: ${{ runner.temp }}/formie-tarballs

            - name: Publish missing package versions with npm OIDC
              env:
                  PACKAGE_TARBALL_DIR: ${{ runner.temp }}/formie-tarballs
              run: npm run release:publish-prepared
